<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cerere de ofertă — demo</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Cerere de ofertă</h1>
      <p class="note">Demo cu date fictive. Nu introduce date personale reale.</p>
    </header>

    <form id="lead-form">
      <label for="message">Mesajul tău</label>
      <textarea id="message" name="message" rows="5" maxlength="500" required
        placeholder="Ex: Vreau o ofertă RCA pentru autoturism"></textarea>

      <div class="form-footer">
        <span id="counter" class="counter">0/500</span>
        <div class="actions">
          <button type="button" id="resend" class="secondary" disabled>Retrimite ultima cerere</button>
          <button type="submit" id="submit">Trimite</button>
        </div>
      </div>
    </form>

    <p id="result" class="result" role="status" aria-live="polite" hidden></p>

    <section>
      <h2>Ultimele cereri</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Categorie</th><th>Mesaj</th><th>Notificare</th><th>Primit</th></tr>
          </thead>
          <tbody id="leads-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
